<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #343a40;
        }

        .btn-fullscreen {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 1.125rem;
            font-weight: 500;
            color: #fff;
            background-color: #0d6efd;
            border: 1px solid #0d6efd;
            border-radius: 0.375rem;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            min-width: 200px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-fullscreen:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        .btn-fullscreen:focus {
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.5);
        }

        .btn-fullscreen:active {
            background-color: #0a58ca;
            border-color: #0a53be;
        }

        .btn-fullscreen.is-fullscreen {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-fullscreen.is-fullscreen:hover {
            background-color: #bb2d3b;
            border-color: #b02a37;
        }

        .btn-fullscreen.is-fullscreen:focus {
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.5);
        }

        .status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
    <title>fullscreen api</title>
</head>

<body>
    <div class="container">
        <h1>fullscreen API 的使用</h1>
        <button class="btn-fullscreen" id="btn-fullscreen">進入全螢幕</button>
        <p class="status" id="status">目前狀態：一般模式</p>
    </div>

    <script>
        const btn = document.querySelector("#btn-fullscreen");
        const status = document.querySelector("#status");

        btn.addEventListener("click", () => {
            if (isFullscreen()) {
                // 離開 fullscreen 只有在 document 下有
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen()
            }
        });

        document.addEventListener("fullscreenchange", () => {
            // 判斷是否全螢幕
            if (isFullscreen()) {
                // 是全螢幕
                btn.textContent = "離開全螢幕";
                btn.classList.add("is-fullscreen");
                status.textContent = "目前狀態：全螢幕模式";
                return
            }
            // 不是全螢幕
            btn.textContent = "進入全螢幕";
            btn.classList.remove("is-fullscreen");
            status.textContent = "目前狀態：一般模式";
        });

        function isFullscreen() {
            return !!(document.fullscreenElement)
        }
    </script>
</body>

</html>

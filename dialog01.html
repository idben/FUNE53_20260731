<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            box-sizing: border-box;
        }

        .btn-primary {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            background-color: #0d6efd;
            border: 1px solid #0d6efd;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        .btn-primary:active {
            background-color: #0a58ca;
            border-color: #0a53be;
        }

        dialog {
            border: none;
            border-radius: 12px;
            padding: 0;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #dee2e6;
        }

        .dialog-header h2 {
            font-size: 20px;
            color: #212529;
            margin: 0;
            padding: 0;
        }

        .dialog-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #6c757d;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            transition: color 0.2s;
        }

        .dialog-close:hover {
            color: #212529;
        }

        .dialog-body p {
            margin: 0;
            padding: 0;
        }

        .dialog-body {
            padding: 24px;
            color: #495057;
            font-size: 15px;
            line-height: 1.6;
        }

        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
            border-top: 1px solid #dee2e6;
        }
    </style>
    <title>dialog 01</title>
</head>

<body>
    <button class="btn-primary" id="btn-open">開啟 Dialog</button>

    <dialog id="my-dialog">
        <div class="dialog-header">
            <h2>歡迎使用 dialog</h2>
            <button class="dialog-close" id="btn-close">x</button>
        </div>
        <div class="dialog-body">
            <p>斗內留在共享買了當前位置長沙國人關於城市如今報告，之處至今隨便動態社區鄉民場所革命發出貢獻和他患者，爸爸平台結婚焦點台鐵我看快捷產業，大師魯蛇失望似乎步驟痛苦記錄東京，閲讀者，學術創新，員工夥伴，顯。</p>
        </div>
        <div class="dialog-footer">
            <button class="btn-primary" id="btn-confirm">確認</button>
        </div>
    </dialog>


    <script>
        const btnOpen = document.querySelector("#btn-open");
        const btnClose = document.querySelector("#btn-close");
        const btnConfirm = document.querySelector("#btn-confirm");
        const myDialog = document.querySelector("#my-dialog");

        btnOpen.addEventListener("click", () => {
            myDialog.showModal();
            // .show() 沒有 backdrop，不會自動長在正中間
        });

        btnClose.addEventListener("click", closeDialog);
        btnConfirm.addEventListener("click", closeDialog);

        function closeDialog() {
            myDialog.close();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單的編輯介面</title>
</head>

<body>
    <h1>簡單的編輯介面</h1>
    <div class="editor" contenteditable>
        在裡面編輯文章，
        描述幫忙股東請在評估湖北應該工作人員，必須成績床上某些鏡頭對著回覆把握快樂你可以，貫徹同時較高所說對他背後古代父親一笑我的，曾經勝利夢想大陸本月，馬上願意微笑編輯屏東認定，玩具採購實驗有所思路控制我說初步最佳力量，語文對他中文版液晶人物專區小遊戲，根本優秀，感情回家如同剛才，本科想像公佈符合曝光引進斑竹基本上隨時，花園韓國新型幾個一身，影響不再而已首先思路，長沙上門權益，<mark>男人早已圖書</mark>，億元工資貼。
    </div>

    <script>
        const editor = document.querySelector(".editor");
        editor.addEventListener("mouseup", () => {
            // Selection API 取得選取文字
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();

            // 沒選擇文字時，程式中斷
            if (selectedText.length <= 0) return;

            // 文字加上 <mark>
            const mark = document.createElement("mark");
            mark.textContent = selectedText;

            // 抓取選取範圍
            const range = selection.getRangeAt(0)

            range.deleteContents();
            range.insertNode(mark)
        });
    </script>
</body>

</html>

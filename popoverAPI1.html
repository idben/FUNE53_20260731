<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>popover API 1</title>
</head>

<body>
    <button popovertarget="my-popover">開啟 popover</button>
    <div id="my-popover" popover>
        <p>這是彈出的內容</p>
    </div>
</body>

</html>

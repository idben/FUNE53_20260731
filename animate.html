<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hello {
            font-family: sans-serif;
            font-weight: bold;
            font-size: 100px;
        }
    </style>
    <title>animate.css 的使用</title>
</head>

<body>
    <div class="hello animate__animated animate__rotateIn">HELLO</div>
</body>

</html>
